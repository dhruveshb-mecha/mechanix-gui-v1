name: Services - Build aarch64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - dev-arm64-build
      - pre-release
    paths:
      - "services/**"
      - ".github/workflows/build-services-aarch64.yml"

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10
  CARGO_NET_GIT_FETCH_WITH_CLI: true

  MECHA_PULP_USERNAME: ${{ secrets.MECHA_PULP_USERNAME }}
  MECHA_PULP_PASSWORD: ${{ secrets.MECHA_PULP_PASSWORD }}
  MECHA_PULP_API_URL: ${{ vars.MECHA_PULP_API_URL }}

  MECHA_PULP_DEBS_REPOSITORY_NAME: ${{ vars.MECHA_PULP_DEBS_REPOSITORY_NAME }}
  MECHA_PULP_RPMS_REPOSITORY_NAME: ${{ vars.MECHA_PULP_RPMS_REPOSITORY_NAME }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    environment: pre-release
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: conf service for mechanix
            package: mxconf
            path: services/conf
          - name: session dbus service
            package: session_service
            path: services/desktop
          - name: search service
            package: mxsearch
            path: services/search/server
          - name: system dbus service
            package: mechanix-system-service
            path: services/system
          - name: extension service
            package: mechanix-extension-service
            path: services/extensions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            fakeroot \
            libdbus-1-dev \
            libpulse-dev \
            libpam0g-dev \
            libclang-dev \
            librust-gdk-pixbuf-sys-dev \
            pipx \
            jq

      - name: Install cargo tools
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Install Nushell
        run: |
          curl -fsSL https://apt.fury.io/nushell/gpg.key | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/fury-nushell.gpg
          echo "deb https://apt.fury.io/nushell/ /" | sudo tee /etc/apt/sources.list.d/fury.list
          sudo apt update
          sudo apt install nushell

      - name: Setup | Pulp CLI
        run: |
          pipx install --force pulp-cli[pygments]
          pipx inject pulp-cli pulp-cli-deb pulp_rpm

      - name: Setup | Pulp CLI Configuration
        run: |
          set -euo pipefail

          if [[ -z "$MECHA_PULP_API_URL" ]]; then
            echo "[ERROR] MECHA_PULP_API_URL is empty"
            exit 1
          fi

          pulp config create \
            --username "$MECHA_PULP_USERNAME" \
            --password "$MECHA_PULP_PASSWORD" \
            --base-url "${MECHA_PULP_API_URL}:8080" \
            --overwrite

      - name: Set up Git SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_GIT }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Cargo fetch
        run: cargo fetch

      - name: Build [${{ matrix.package }}]
        run: cargo build --release --package ${{ matrix.package }}

      - name: Read Cargo version [${{ matrix.package }}]
        id: cargo_version
        run: |
          set -euo pipefail

          VERSION=$(nu -c "
            open ${{ matrix.path }}/Cargo.toml
            | get package.version
          ")

          echo "[INFO] Upstream version: $VERSION"
          echo "upstream=$VERSION" >> $GITHUB_OUTPUT

      - name: Resolve versions [${{ matrix.package }}]
        id: version_info
        run: |
          # Execute nushell and capture output
          # We use 'tr -d "\n"' to ensure the JSON is on a single line for easier parsing
          JSON_OUT=$(nu utils/resolve-next-version.nu \
            --format deb \
            --name ${{ matrix.package }} \
            --upstream ${{ steps.cargo_version.outputs.upstream }} | tr -d '\n')

          echo "Full JSON: $JSON_OUT"

          # Extract values
          REVISION=$(echo "$JSON_OUT" | jq -r '.next_revision')
          FULL_VER=$(echo "$JSON_OUT" | jq -r '.full_version')

          # Set GitHub Step Outputs
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "full_version=$FULL_VER" >> "$GITHUB_OUTPUT"

      - name: Package deb [${{ matrix.package }}]
        run: |
          cargo deb \
            --deb-revision "${{ steps.version_info.outputs.revision }}" \
            --no-build \
            --package ${{ matrix.package }}

      - name: Repack DEB natively [${{ matrix.package }}]
        run: |
          set -euo pipefail
          
          # Navigate to the directory to make globbing simpler
          cd target/debian/
          
          # Find the first .deb file available
          DEB_FILE=$(ls *.deb | head -n1)

          if [[ -z "$DEB_FILE" ]]; then
            echo "[ERROR] No .deb file found in target/debian/"
            exit 1
          fi

          echo "[INFO] Repacking $DEB_FILE"
          
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT

          # Perform the repack
          fakeroot dpkg-deb -R "$DEB_FILE" "$TMPDIR/pkg"
          fakeroot dpkg-deb -b "$TMPDIR/pkg" "$DEB_FILE"

      - name: Generate RPM [${{ matrix.package }}]
        run: |
          cargo generate-rpm -p "$(pwd)/${{ matrix.path }}"
          ls -la target/generate-rpm

      - name: Prepare artifacts
        run: |
          mkdir -p build
          # Use wildcards to grab whatever was built
          cp target/debian/*.deb build/ 2>/dev/null || true
          cp target/generate-rpm/*.rpm build/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-artifacts
          path: build/*
